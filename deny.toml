# cargo-deny: what may enter the dependency graph. Checked in CI.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Known vulnerabilities fail the build; so do yanked crates.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only (compatible with this project's MIT license).
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # webpki-root-certs (Mozilla's CA list), via rustls-platform-verifier
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
