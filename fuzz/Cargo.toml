[package]
name = "moneylover-mcp-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
serde_json = "1.0.154"
chrono-tz = "0.10.4"

[dependencies.moneylover-mcp]
path = ".."

# Not part of the main workspace: fuzzing needs nightly and must not affect normal builds.
[workspace]

[[bin]]
name = "parse_response"
path = "fuzz_targets/parse_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_date"
path = "fuzz_targets/parse_date.rs"
test = false
doc = false
bench = false
