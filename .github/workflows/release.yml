name: Release

# Pushing a tag like `v0.1.0` builds every target, attests the build provenance and
# publishes a GitHub release. Running the workflow by hand only builds (a dry run).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN: moneylover-mcp

jobs:
  verify:
    name: verify version and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must match Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          crate_version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v${crate_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate_version}"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked

  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # build provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds use Ubuntu 22.04 so the binaries also run on older distributions (glibc 2.35+).
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, archive: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, archive: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "${GITHUB_REF}" == refs/tags/* ]] || version="dev-${GITHUB_SHA::7}"
          name="${BIN}-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          exe=""
          [[ "${{ matrix.target }}" == *windows* ]] && exe=".exe"
          cp "target/${{ matrix.target }}/release/${BIN}${exe}" README.md LICENSE "dist/${name}/"
          cd dist
          if [[ "${{ matrix.archive }}" == zip ]]; then
            7z a -bso0 "${name}.zip" "${name}"
            archive="${name}.zip"
          else
            tar -czf "${name}.tar.gz" "${name}"
            archive="${name}.tar.gz"
          fi
          echo "archive=dist/${archive}" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        if: "!contains(matrix.target, 'x86_64-apple')" # cross-built on an arm64 runner
        shell: bash
        run: |
          exe=""
          [[ "${{ matrix.target }}" == *windows* ]] && exe=".exe"
          "target/${{ matrix.target }}/release/${BIN}${exe}" --version
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # One <file>.sigstore.json per asset. OpenSSF Scorecard's Signed-Releases check
      # looks for these next to the release assets.
      - name: Sign the release assets
        working-directory: dist
        shell: bash
        run: |
          for f in *; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          Prebuilt binaries for \`${GITHUB_REF_NAME}\`. Pick the archive for your platform,
          extract it and put \`${BIN}\` on your PATH, then run \`${BIN} login\` once.
          See the README for client configuration.

          **Verify your download** (recommended):

          \`\`\`sh
          sha256sum --check --ignore-missing SHA256SUMS      # or: shasum -a 256 -c SHA256SUMS
          gh attestation verify <archive> --repo ${GH_REPO}   # proves it was built by this workflow
          cosign verify-blob <archive> --bundle <archive>.sigstore.json \\
            --certificate-identity-regexp '^https://github.com/${GH_REPO}/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          Unofficial project, not affiliated with Money Lover. Use at your own risk.
          EOF
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag

  bundle:
    name: build MCPB bundles
    needs: publish # the release must exist: the assets' URLs go into server.json
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest # lipo merges the two macOS slices into one universal binary
    permissions:
      contents: write # attach the bundles to the release
      id-token: write # build provenance attestation and cosign signing
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Assemble the bundles
        run: bash scripts/build-mcpb.sh "${GITHUB_REF_NAME}"
      - name: Check that a bundle actually runs
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bundle-check"
          unzip -q mcpb/out/moneylover-mcp-darwin.mcpb -d "$RUNNER_TEMP/bundle-check"
          "$RUNNER_TEMP/bundle-check/server/${BIN}" --version
          lipo -archs "$RUNNER_TEMP/bundle-check/server/${BIN}"
      - name: Attest bundle provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: mcpb/out/*.mcpb
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the bundles
        working-directory: mcpb/out
        shell: bash
        run: |
          for f in *.mcpb; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
      - name: Attach the bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${GITHUB_REF_NAME}" mcpb/out/* --clobber
