[package]
name = "moneylover-mcp"
version = "0.5.0"
edition = "2024"
# std::fs::File::try_lock
rust-version = "1.89"
description = "Unofficial MCP server for the Money Lover personal finance app (stdio)"
license = "MIT"
repository = "https://github.com/Iyongbudiarso/moneylover-mcp"
readme = "README.md"
keywords = ["mcp", "moneylover", "finance"]
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
rmcp = { version = "3.5.1", features = ["server", "transport-io"] }
rpassword = "7"
rust_decimal = "1.43.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
rmcp = { version = "3.5.1", features = ["client", "server", "transport-io"] }
wiremock = "0.6.5"
